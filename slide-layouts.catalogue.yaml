# Slide layout catalogue — single capacity source for deck generation (T-204).
#
# `capacity.blocks` is the deterministic fit-check cap and mirrors the editor's
# named slots: one DocModel block per slot. The other numeric capacities are
# Pass 1 writer budgets for content inside those blocks.

schemaVersion: "1.0.0"
lastUpdated: "2026-06-17"

layouts:
  cover:
    id: "cover"
    use-when: "Opening slide with a single strong title, image, or hero message."
    capacity: { blocks: 1, headlineChars: 110 }
    slots:
      hero: { accepts: [heading, prose, image, callout], capacity: { blocks: 1 } }

  section-divider:
    id: "section-divider"
    use-when: "Chapter break or transition between major sections."
    capacity: { blocks: 1, titleChars: 90 }
    slots:
      title: { accepts: [heading, prose], capacity: { blocks: 1 } }

  agenda:
    id: "agenda"
    use-when: "Ordered meeting or deck roadmap."
    capacity: { blocks: 1, items: 6 }
    slots:
      agenda: { accepts: [numbered-list, bullet-list], capacity: { blocks: 1 } }

  title-body:
    id: "title-body"
    use-when: "Standard message slide: title plus one body block."
    capacity: { blocks: 2, titleChars: 90, bodyWords: 140, bullets: 6 }
    slots:
      title: { accepts: [heading], capacity: { blocks: 1 } }
      body: { accepts: [prose, bullet-list, numbered-list, callout], capacity: { blocks: 1 } }

  two-column:
    id: "two-column"
    use-when: "Comparison, pros/cons, before/after, or two parallel arguments."
    capacity: { blocks: 2, columnWords: 90, bulletsPerColumn: 4 }
    slots:
      left: { accepts: [prose, bullet-list, numbered-list, callout, image], capacity: { blocks: 1 } }
      right: { accepts: [prose, bullet-list, numbered-list, callout, image], capacity: { blocks: 1 } }

  three-column:
    id: "three-column"
    use-when: "Three options, pillars, workstreams, or sequential takeaways."
    capacity: { blocks: 3, columnWords: 55, bulletsPerColumn: 3 }
    slots:
      left: { accepts: [prose, bullet-list, callout, kpi-cards], capacity: { blocks: 1 } }
      middle: { accepts: [prose, bullet-list, callout, kpi-cards], capacity: { blocks: 1 } }
      right: { accepts: [prose, bullet-list, callout, kpi-cards], capacity: { blocks: 1 } }

  chart-full:
    id: "chart-full"
    use-when: "One chart is the slide; prose belongs in the chart takeaway."
    capacity: { blocks: 1, chartSeries: 5, chartCategories: 8 }
    slots:
      chart: { accepts: [chart], capacity: { blocks: 1 } }

  chart-commentary:
    id: "chart-commentary"
    use-when: "Chart plus short interpretation or implications."
    capacity: { blocks: 2, chartSeries: 4, chartCategories: 6, commentaryBullets: 4 }
    slots:
      chart: { accepts: [chart], capacity: { blocks: 1 } }
      commentary: { accepts: [prose, bullet-list, callout], capacity: { blocks: 1 } }

  table:
    id: "table"
    use-when: "Compact matrix or data table that must be read directly."
    capacity: { blocks: 1, tableRows: 10, tableColumns: 5 }
    slots:
      table: { accepts: [table], capacity: { blocks: 1 } }

  quote:
    id: "quote"
    use-when: "A single quotation, recommendation, or executive sound bite."
    capacity: { blocks: 1, quoteChars: 180 }
    slots:
      quote: { accepts: [prose, callout], capacity: { blocks: 1 } }

  process-timeline:
    id: "process-timeline"
    use-when: "Phased plan, timeline, roadmap, or process sequence."
    capacity: { blocks: 1, milestones: 6 }
    slots:
      timeline: { accepts: [timeline, roadmap], capacity: { blocks: 1 } }

  team:
    id: "team"
    use-when: "Team, governance group, or stakeholder roster."
    capacity: { blocks: 1, people: 6 }
    slots:
      team: { accepts: [team], capacity: { blocks: 1 } }

  kpis:
    id: "kpis"
    use-when: "Metric-led slide with several headline numbers."
    capacity: { blocks: 1, cards: 5 }
    slots:
      kpis: { accepts: [kpi-cards], capacity: { blocks: 1 } }

  image-caption:
    id: "image-caption"
    use-when: "Large image or diagram with one short caption."
    capacity: { blocks: 2, captionChars: 180 }
    slots:
      image: { accepts: [image, diagram], capacity: { blocks: 1 } }
      caption: { accepts: [prose, callout], capacity: { blocks: 1 } }

  closing:
    id: "closing"
    use-when: "Final recommendation, decision, or next steps."
    capacity: { blocks: 1, actions: 4 }
    slots:
      closing: { accepts: [numbered-list, bullet-list, callout, prose], capacity: { blocks: 1 } }
